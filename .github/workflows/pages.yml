# 3·5주차: main 에 push 하면 React 화면(web)을 빌드해서 GitHub Pages 로 배포한다
# 5단계에서 바꾼 점: 테스트(npm test)가 통과해야만 빌드·배포까지 간다
#   (4단계에서 테스트가 빨간 X 인데도 배포가 초록이던 문제를 막음)
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 검사 · 테스트 · 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 하네스 검사 (README · CLAUDE.md)
        run: node .claude/hooks/check.mjs
      - name: 설치
        working-directory: web
        run: npm ci
      - name: 테스트 (기대값 표) — 실패하면 여기서 멈추고 배포 안 함
        working-directory: web
        run: npm test
      - name: 빌드 (web/dist 생성)
        working-directory: web
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: 배포
    needs: build          # build 가 초록일 때만 실행
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
