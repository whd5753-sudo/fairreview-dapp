# 3·4·5·8·10단계: push 하면 자동으로 검사한다. 하나라도 실패하면 빨간 X, 모두 통과하면 초록 체크
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: 하네스 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 로컬 훅과 같은 검사 (README · CLAUDE.md)
        run: node .claude/hooks/check.mjs
      - name: 개인키 파일(.env)이 저장소에 올라오지 않았는지 확인
        run: test -z "$(git ls-files | grep -E '(^|/)\.env$')"

  web:
    name: 웹 테스트 · 빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: 테스트 (Vitest · 기대값 표 · 화면)
        run: npm test
      - name: 빌드가 깨지지 않는지
        run: npm run build

  contracts:
    name: 컨트랙트 테스트 (Hardhat · 테스트 설계 표)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: 오라클 서명 코드 설치 (테스트가 oracle/sign.mjs 로 서명한다)
        run: npm ci --prefix ../oracle
      - name: 컴파일 (npm solc 0.8.24)
        run: npx hardhat compile
      - name: 테스트
        run: npx hardhat test

  oracle:
    name: AI 오라클 테스트 (서명 · 판정)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oracle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: 오라클 개인키(.env)가 저장소에 없는지
        run: test -z "$(git ls-files | grep -E '(^|/)\.env$')"
